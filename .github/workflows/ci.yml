name: CI
on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  lint:
    name: Lint Shell Scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: |
          sudo apt-get update -y
          sudo apt-get install -y shellcheck
      - name: Find shell scripts
        run: |
          echo "Procurando scripts .sh..."
          find . -type f -name "*.sh" -print > shell_scripts.txt || true
          if [ -s shell_scripts.txt ]; then
            echo "Executando shellcheck..."
            xargs -a shell_scripts.txt shellcheck
          else
            echo "Nenhum script .sh encontrado. Pulando shellcheck."
          fi
